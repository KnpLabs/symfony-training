---
services:
  php:
    platform: linux/x86_64
    build: .
    environment:
      APP_SECRET: $ecretf0rd3v
      MYSQL_HOST: database
      MYSQL_PORT: 3306
      MYSQL_VERSION: 8.0.27
      MYSQL_DATABASE: databasorus
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - .:/usr/src/app:rw
    restart: unless-stopped

  nginx:
    platform: linux/x86_64
    image: nginx:alpine
    ports:
      - 80:80
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/usr/src/app/public:ro
    restart: unless-stopped

  phpmyadmin:
    platform: linux/x86_64
    image: phpmyadmin
    environment:
      PMA_ARBITRARY: 1
    ports:
      - 8080:80
    restart: unless-stopped

  database:
    platform: linux/x86_64
    image: mysql:8.4
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
    volumes:
      - db_data:/var/lib/mysql:rw
    restart: unless-stopped

volumes:
  db_data: ~
